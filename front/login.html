<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Moral Compass - Iniciar sesión o crear cuenta" />
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?display=swap&family=Inter:wght@400;500;600;700;900" />
  <title>Moral Compass — Iniciar Sesión</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.15);
      }

      50% {
        box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out both;
    }

    .animate-fade-in {
      animation: fadeIn 0.4s ease-out both;
    }

    .animate-pulse-glow {
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .glass-card {
      background: rgba(31, 41, 55, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(75, 85, 99, 0.4);
    }

    .input-field {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(75, 85, 99, 0.5);
      transition: all 0.3s ease;
    }

    .input-field:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #059669);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #16a34a, #047857);
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .bg-grid {
      background-image:
        radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center bg-grid">

  <div class="w-full max-w-md px-4 animate-fade-in-up">
    <!-- Logo / Branding -->
    <div class="text-center mb-8">
      <div
        class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-green-500 to-emerald-600 mb-4 shadow-lg shadow-green-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Moral Compass</h1>
      <p class="text-gray-400 text-sm mt-1">Organizá tu día con propósito</p>
    </div>

    <!-- Auth Card -->
    <div class="glass-card rounded-2xl p-8 shadow-2xl animate-pulse-glow">
      <h2 id="auth-title" class="text-xl font-semibold text-white mb-6 text-center">Iniciar sesión</h2>

      <!-- Error Message -->
      <div id="error-msg"
        class="hidden mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center animate-fade-in">
      </div>

      <!-- Success Message -->
      <div id="success-msg"
        class="hidden mb-4 p-3 rounded-xl bg-green-500/10 border border-green-500/30 text-green-400 text-sm text-center animate-fade-in">
      </div>

      <form id="auth-form" class="space-y-4">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-300 mb-1.5">Usuario</label>
          <input type="text" id="username" name="username" required autocomplete="username"
            class="input-field w-full rounded-xl px-4 py-3 text-black placeholder-gray-500 text-sm"
            placeholder="Tu nombre de usuario" />
        </div>

        <!-- Email (register only) -->
        <div id="email-field" class="hidden">
          <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
          <input type="email" id="email" name="email" autocomplete="email"
            class="input-field w-full rounded-xl px-4 py-3 text-black placeholder-gray-500 text-sm"
            placeholder="tu@email.com" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
            class="input-field w-full rounded-xl px-4 py-3 text-black placeholder-gray-500 text-sm"
            placeholder="••••••••" />
        </div>

        <!-- Submit -->
        <button type="submit" id="submit-btn"
          class="btn-primary w-full py-3 rounded-xl text-white font-semibold text-sm mt-2">
          <span id="btn-text">Iniciar sesión</span>
          <span id="btn-spinner" class="hidden"><span class="spinner"></span></span>
        </button>
      </form>

      <!-- Toggle Mode -->
      <p class="text-center text-sm text-gray-400 mt-6">
        <span id="toggle-hint">¿No tenés cuenta?</span>
        <button id="toggle-mode"
          class="text-green-400 hover:text-green-300 font-medium ml-1 transition-colors duration-200 underline underline-offset-2">
          Crear cuenta
        </button>
      </p>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6">Moral Compass &copy; 2026</p>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:5000';
    let isLogin = true;

    const authTitle = document.getElementById('auth-title');
    const authForm = document.getElementById('auth-form');
    const emailField = document.getElementById('email-field');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const toggleMode = document.getElementById('toggle-mode');
    const toggleHint = document.getElementById('toggle-hint');
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
      successMsg.classList.add('hidden');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.remove('hidden');
      errorMsg.classList.add('hidden');
    }

    function hideMessages() {
      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.classList.toggle('hidden', loading);
      btnSpinner.classList.toggle('hidden', !loading);
    }

    // Toggle between login and register
    toggleMode.addEventListener('click', () => {
      isLogin = !isLogin;
      hideMessages();
      if (isLogin) {
        authTitle.textContent = 'Iniciar sesión';
        btnText.textContent = 'Iniciar sesión';
        emailField.classList.add('hidden');
        emailInput.required = false;
        toggleHint.textContent = '¿No tenés cuenta?';
        toggleMode.textContent = 'Crear cuenta';
      } else {
        authTitle.textContent = 'Crear cuenta';
        btnText.textContent = 'Registrarse';
        emailField.classList.remove('hidden');
        emailInput.required = true;
        toggleHint.textContent = '¿Ya tenés cuenta?';
        toggleMode.textContent = 'Iniciar sesión';
      }
    });

    // Form submit
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();
      setLoading(true);

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        if (isLogin) {
          // LOGIN
          const res = await fetch(`${API_BASE}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (data.status === 'success') {
            localStorage.setItem('token', data.token);
            localStorage.setItem('username', data.username || username);

            if (data.onboarding_complete === false) {
              window.location.href = 'onboarding.html';
            } else {
              window.location.href = 'index.html';
            }
          } else {
            showError(data.message || 'Error al iniciar sesión');
          }
        } else {
          // REGISTER
          const email = document.getElementById('email').value.trim();
          const res = await fetch(`${API_BASE}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
          });
          const data = await res.json();

          if (data.status === 'success') {
            showSuccess(data.message || '¡Cuenta creada! Ahora podés iniciar sesión.');
            // Switch to login mode after success
            setTimeout(() => {
              isLogin = true;
              authTitle.textContent = 'Iniciar sesión';
              btnText.textContent = 'Iniciar sesión';
              emailField.classList.add('hidden');
              emailInput.required = false;
              toggleHint.textContent = '¿No tenés cuenta?';
              toggleMode.textContent = 'Crear cuenta';
            }, 1500);
          } else {
            showError(data.message || 'Error al crear la cuenta');
          }
        }
      } catch (err) {
        console.error('Auth error:', err);
        showError('Error de conexión. Asegurate que el servidor esté corriendo.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
