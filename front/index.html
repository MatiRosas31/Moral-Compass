    <div id="super-container" class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden" style='font-family: Inter, "Noto Sans", sans-serif;'>
      
      <!-- HEADER -->
      <div>

          <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Bienvenido, Matias</h2>
        </div>
      </div>
  
      <!-- CONTENIDO PRINCIPAL -->
      <h2 class="today text-white tracking-light text-[28px] font-bold leading-tight px-4 text-left pb-3 pt-5">Today, 10:30 AM</h2>

    <!-- NAV BAR CENTRADO -->
<div class="flex justify-center gap-5 border-t border-[#1f2937] px-4 pt-2">
